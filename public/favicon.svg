<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sdFaviconGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="sdFaviconGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="sdFaviconSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  <!-- 背景底色，確保在各色瀏覽器分頁標籤上皆清晰顯眼 -->
  <rect width="100" height="100" rx="22" fill="#0f172a" />
  <!-- 六角護盾輪廓 -->
  <polygon points="50,10 84,30 84,70 50,90 16,70 16,30" stroke="url(#sdFaviconGrad1)" stroke-width="4" stroke-opacity="0.45" fill="none"/>
  <!-- 左上 < 代碼括號 -->
  <path d="M 41,26 L 23,42 L 41,58" stroke="url(#sdFaviconGrad1)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 右下 > 代碼括號 -->
  <path d="M 59,42 L 77,58 L 59,74" stroke="url(#sdFaviconGrad2)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 中間斜線與連結 -->
  <path d="M 41,41 L 59,59" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- 智能微光核心 -->
  <circle cx="50" cy="50" r="5" fill="url(#sdFaviconSpark)"/>
</svg>
